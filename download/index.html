<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Get brimm</title>
<meta name="description" content="Get brimm on the App Store or Google Play.">
<!-- brimm.ai/download — ONE link that opens the right store (founder OK 25 Nov 2026 14:52, HQ #2460). An iPhone or iPad goes to the
     App Store, an Android phone to Google Play, at once. The addresses are read from the site's one store file (assets/stores.js
     BRIMM_STORES[k].url) and its one device rule (BRIMM_DEVICE) — never typed here. This link opens the store whatever the badges' on/off
     switch says: the founder ruled the link itself (#2460); the badges elsewhere keep their own switch.
     A COMPUTER (or anything else) sees this page: both official badges and a QR code that points back here, so a phone scanning it is
     sent to its own store. Not for search: noindex, no canonical, no sitemap. -->
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060912">
<script src="/assets/stores.js?v=c07aac4c"></script>
<script>
  (function () {
    var S = window.BRIMM_STORES || {}, d = window.BRIMM_DEVICE;
    var to = d === 'ios' ? S.ios && S.ios.url : d === 'android' ? S.play && S.play.url : '';
    if (to) location.replace(to);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=bf8a6d0a">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=e0c97112">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=90fac137">

<style>
  /* Manrope, served from this site (no third-party font call); SIL OFL: /assets/fonts/ */
  @font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope-Regular-latin.ttf?v=35083cda') format('truetype');font-weight:400 600;font-display:swap}
  @font-face{font-family:'Manrope';src:url('/assets/fonts/Manrope-Bold-latin.ttf?v=0702f46a') format('truetype');font-weight:700 900;font-display:swap}
  /* The home page's tokens and hero (as brimm.ai/go): a city photo under the site's scrim, night ground. */
  :root{--night:#060912;--teal:#7EC8C8;--grad:linear-gradient(100deg,#A6EBEB 0%,#C9B6FF 100%);--ink:#EEF2FA;--sub:#B3BDD3;--mute:#8A95AD;
    --card:rgba(18,27,54,.78);--card-line:rgba(255,255,255,.12);color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{min-height:100vh;background:var(--night);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.35;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  img{display:block;max-width:100%}
  .bg{position:fixed;inset:0;z-index:0}
  .bg img{width:100%;height:100%;object-fit:cover}
  .scrim{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(6,9,18,.45) 0%,rgba(6,9,18,.25) 25%,rgba(6,9,18,.70) 55%,rgba(6,9,18,.92) 100%)}
  .wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:28px max(20px,env(safe-area-inset-right,0px)) 28px max(20px,env(safe-area-inset-left,0px))}
  .brand{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
  .brand img{filter:drop-shadow(0 1px 2px rgba(6,9,18,.7)) drop-shadow(0 0 6px rgba(6,9,18,.6))}
  .brand .m{width:38px;height:38px}.brand .w{height:25px;width:auto}
  .copy{margin-top:clamp(40px,9vh,110px);text-align:center}
  h1{font-size:clamp(36px,6vw,58px);line-height:1;letter-spacing:-.045em;font-weight:800;text-shadow:0 4px 30px rgba(0,0,0,.35)}
  .grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
  .proof{margin-top:14px;font-size:19px;font-weight:800;letter-spacing:-.01em}
  .proof b{color:var(--teal);font-weight:800}
  .card{margin-top:34px;display:flex;align-items:center;gap:34px;padding:26px 30px;border-radius:24px;background:var(--card);border:1px solid var(--card-line);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .badges{display:flex;flex-direction:column;align-items:center;gap:14px}
  .badges a{display:block;border-radius:10px}
  .badges a:focus-visible,.brand:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  .badges .as{height:54px;width:auto}
  .badges .gp{height:80px;width:auto;margin:-13px 0}   /* Google's PNG carries its own clear space; this lines its art up with Apple's */
  .or{width:1px;align-self:stretch;background:var(--card-line)}
  .qr{text-align:center}
  .qr img{width:148px;height:148px;border-radius:12px}
  .qr p{margin-top:10px;font-size:13px;font-weight:700;color:var(--sub)}
  .credit{position:fixed;right:12px;bottom:10px;z-index:3;font-size:10.5px;color:#fff;background:rgba(6,9,18,.66);padding:2px 8px;border-radius:999px}
  .credit b{font-weight:700}
  .foot{margin-top:auto;padding-top:30px;font-size:11.5px;color:var(--mute)}
  .foot a{color:var(--mute)}
  @media (max-width:560px){ .card{flex-direction:column;gap:22px} .or{width:auto;height:1px;align-self:stretch}
    .credit{position:relative;right:auto;bottom:auto;display:table;margin:8px auto 0} }   /* under the footer, never over it */
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"><img src="/assets/hero/paris.jpg?v=d1cf2fac" srcset="/assets/hero/paris-960.jpg?v=29bad64f 960w, /assets/hero/paris.jpg?v=d1cf2fac 1920w" sizes="100vw" alt="" fetchpriority="high"></div>
  <div class="scrim" aria-hidden="true"></div>
  <div class="wrap">
    <a class="brand" href="/" aria-label="brimm home"><img class="m" src="/assets/mark-dark-foreground.svg?v=88298876" alt="" width="38" height="38"><img class="w" src="/assets/wordmark-dark.svg?v=b7c08c48" alt="brimm" width="86" height="25"></a>
    <div class="copy">
      <h1>Get <span class="grad">brimm</span></h1>
      <p class="proof">Visa? <b>Checked.</b> Days? <b>Planned.</b></p>
    </div>
    <div class="card">
      <!-- the official badges, unaltered (Apple's and Google's artwork, assets/badges/); each opens its store -->
      <div class="badges">
        <a href="https://apps.apple.com/app/id6828996131" data-dl="ios" rel="noopener"><img class="as" src="/assets/badges/app-store.svg?v=86c9954e" alt="Download on the App Store" width="162" height="54"></a>
        <a href="https://play.google.com/store/apps/details?id=ai.brimm.app" data-dl="play" rel="noopener"><img class="gp" src="/assets/badges/google-play.png?v=f72611e2" alt="Get it on Google Play" width="206" height="80"></a>
      </div>
      <div class="or" aria-hidden="true"></div>
      <div class="qr">
        <img src="/assets/download-qr.svg?v=15da5642" alt="QR code: scan to get brimm on your phone" width="148" height="148">
        <p>Scan with your phone</p>
      </div>
    </div>
    <p class="foot">© Brimm Limited · <a href="/">brimm.ai</a></p>
    <p class="credit"><b>Paris, France</b> · Chris Karidis on Unsplash</p>
  </div>
  <script>
    // The badges' addresses come from the one store file too (the hrefs above are the no-script fallback, the same addresses).
    document.querySelectorAll('[data-dl]').forEach(function (a) { var s = (window.BRIMM_STORES || {})[a.getAttribute('data-dl')]; if (s && s.url) a.href = s.url; });
  </script>
</body>
</html>
