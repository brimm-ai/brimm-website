<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get brimm</title>
<!-- brimm.ai/download — ONE link that opens the right store (founder OK 25 Nov 2026 14:52, HQ #2460). An iPhone or iPad goes to the
     App Store, an Android phone to Google Play, at once. The addresses are read from the site's one store file (assets/stores.js
     BRIMM_STORES[k].url) and its one device rule (BRIMM_DEVICE) — never typed here. This link opens the store whatever the badges' on/off
     switch says: the founder ruled the link itself (#2460); the badges elsewhere keep their own switch.
     A COMPUTER (or anything else) goes to the home page's download section until the computer page — both badges and a QR code — is
     approved (HQ mock); it then replaces the line marked COMPUTER below. Not for search: noindex, no canonical, no sitemap. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060912">
<noscript><meta http-equiv="refresh" content="0;url=/#get"></noscript>
<script src="/assets/stores.js?v=3a03e1cc"></script>
</head>
<body style="background:#060912">
<!-- the routine runs from the body, as /download/try does (its iframe needs a body). Measured on the Pixel, 27 Nov 2026: Chrome opens the
     Play app from /download?s=x, tagged or not. (A first reading said "from the head, Chrome takes the fallback" — wrong: those runs had
     loaded Chrome's cached copy of the OLD page; with the cache expired, both forms open the app.) -->
<script>
  (function () {
    // ?s=<tag> is handed to the store by BRIMM_STORE_URL (assets/stores.js), only from its fixed list; brimm stores nothing (Q#691 B)
    var d = window.BRIMM_DEVICE, m = /[?&]s=([a-z]{1,5})(?:&|$)/.exec(location.search), tag = m ? m[1] : '';
    // the STORE APP, not its web page (HQ #2694; measured on the Pixel 27 Nov 2026 via /download/try?m=auto): BRIMM_OPEN_STORE in
    // assets/stores.js — Chrome and Chrome tabs follow the intent link to the Play app; an in-app browser asks through an invisible frame
    // and falls back to the web address after 1.5 s, so the worst case is the old behaviour
    if (d === 'ios' || d === 'android') { window.BRIMM_OPEN_STORE(d === 'ios' ? 'ios' : 'play', tag); return; }
    location.replace('/#get');   // COMPUTER: the home page's download section, until the computer page is approved
  })();
</script>
</body>
</html>
